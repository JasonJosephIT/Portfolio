# Site tests (fixture bundle, Playwright browser checks) and the chatbot evals (fixture index, stubbed AI).
# No Cloudflare credentials or other secrets: nothing here reaches Cloudflare.
name: test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 12
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # One install for the site and chatbot/ (pnpm workspace, one lockfile).
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test
      - run: pnpm test
        working-directory: chatbot
