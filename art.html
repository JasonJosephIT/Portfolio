    Gallery contract (admin/edit.js and /place-image depend on it):
    <section class="gallery"> holds <a href="assets/photo-NN.jpg"><img src="assets/photo-NN.jpg" alt="..." loading="lazy"></a>

    <a href="assets/photo-01.jpg" data-title="Placeholder, warm study"><img src="assets/photo-01.jpg" alt="Placeholder plate 01: warm-toned crop of the eyes from the split-lit portrait. Replace with your photograph." width="1400" height="883" loading="lazy"></a>
