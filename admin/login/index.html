<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Jason — Admin Login</title>
  <link rel="stylesheet" href="../../styles.css">
  <link rel="stylesheet" href="../admin.css">
</head>
<body>
  <div class="page-title">
    <span class="eyebrow">Admin</span>
    <h1>Sign in</h1>
    <p>Enter your email and we'll send you a one-time sign-in link.</p>
  </div>

  <div class="admin-wrap">
    <form class="admin-form" id="login-form">
      <input type="email" id="email" placeholder="you@email.com" autocomplete="email" required>
      <button type="submit">Send magic link</button>
      <p class="admin-status" id="status"></p>
    </form>
  </div>

  <script type="module">
    import { getClient } from "../config.js";
    const sb = getClient();
    const status = (msg) => (document.getElementById("status").textContent = msg);
    const dashboard = new URL("../dashboard/", location.href).href;

    // Already signed in (or arriving back from a magic link)? Go straight in.
    const { data: { session } } = await sb.auth.getSession();
    if (session) location.replace(dashboard);
    sb.auth.onAuthStateChange((_event, s) => {
      if (s) location.replace(dashboard);
    });

    document.getElementById("login-form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const { error } = await sb.auth.signInWithOtp({
        email: document.getElementById("email").value,
        options: { emailRedirectTo: dashboard },
      });
      status(error ? error.message : "Magic link sent — check your email.");
    });
  </script>
</body>
</html>
